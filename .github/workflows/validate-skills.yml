name: Validate skills

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-skills-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and conform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate the skill dependency graph
        run: node scripts/validate-skill-graph.mjs

      - name: Run validator, Chronicle, and conformance tests
        run: >-
          node --test
          scripts/validate-skill-graph.test.mjs
          scripts/conformance.test.mjs
          skills/_base/chronicler/tests/chronicler.test.mjs
          skills/_base/chronicler/tests/adversarial.test.mjs
